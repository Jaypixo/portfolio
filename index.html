<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaypix</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, #1f2937 0%, transparent 35%),
        radial-gradient(circle at bottom right, #2563eb 0%, transparent 40%),
        linear-gradient(135deg, #0f172a, #020617);
      color: white;
      overflow: hidden;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 4rem;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .tag {
      display: inline-block;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.25);
      color: #93c5fd;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      letter-spacing: 0.3px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -2px;
      margin-bottom: 1rem;
      line-height: 1;
    }

    .gradient {
      background: linear-gradient(90deg, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.78);
      max-width: 580px;
      margin-bottom: 2.2rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      color: white;
      padding: 0.95rem 1.4rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
      font-weight: 500;
    }

    .links a:hover {
      transform: translateY(-3px);
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(96, 165, 250, 0.35);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
    }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 768px) {
      .card {
        padding: 2.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="tag">Personal Website</div>

    <h1 class="gradient">Jaypix</h1>

    <p>
      Developer, creator, and technology enthusiast.
      This is my small corner of the internet where I’ll share projects,
      experiments, and more in the future.
      <br><br>
      The site is currently under construction.
      More coming soon.
    </p>

    <div class="links">
      <a href="https://youtube.com/" target="_blank">YouTube</a>
      <a href="https://github.com/" target="_blank">GitHub</a>
    </div>

    <div class="footer">
      © 2026 Jaypix
    </div>
  </div>

</body>
</html>
