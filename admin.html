<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin - Cloudflare KV</title>
<link rel="icon" type="image/png" href="Public/Jaylogo.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #1a1716;
  --paper: #f5f0e8;
  --smudge: #9b8f82;
  --accent: #c7522a;
  --accent2: #3b6e8f;
  --accent3: #5c7a3e;
  --red: #b83232;
  --sans: 'Inter', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}

[data-theme="dark"] {
  --ink: #e8e0d4;
  --paper: #18161a;
  --smudge: #7a7068;
  --accent: #e0693a;
  --accent2: #5a9abf;
  --accent3: #7aaa55;
  --red: #d44444;
}

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  padding: 2rem;
  max-width: 900px;
  margin: 0 auto;
}

h1 { color: var(--accent); margin-bottom: 1rem; }
.auth-panel {
  background: rgba(255,255,255,0.95);
  border: 1px solid var(--smudge);
  padding: 2rem;
  border-radius: 8px;
  max-width: 400px;
  margin: 0 auto;
}
.auth-panel p { margin-bottom: 1rem; }
.form-group { margin-bottom: 1rem; }
label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
input, textarea, button {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--smudge);
  border-radius: 4px;
  font-family: inherit;
}
input:focus, textarea:focus { outline: 2px solid var(--accent); }
button {
  background: var(--accent);
  color: white;
  border: none;
  cursor: pointer;
  font-weight: 500;
  transition: background 0.2s;
}
button:hover { background: var(--accent2); }
button:disabled { background: var(--smudge); cursor: not-allowed; }

.posts { margin-top: 2rem; }
.post {
  background: rgba(255,255,255,0.9);
  border: 1px solid var(--smudge);
  padding: 1.5rem;
  margin-bottom: 1rem;
  border-radius: 8px;
}
.post h3 {
  margin-bottom: 0.5rem;
  color: var(--accent);
  font-size: 1.2rem;
}
.post .date {
  font-size: 0.9rem;
  color: var(--smudge);
  margin-bottom: 1rem;
}
.post .content {
  margin-bottom: 1rem;
  white-space: pre-wrap;
  line-height: 1.6;
}
.post-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}
.post-actions button {
  width: auto;
  padding: 0.5rem 1rem;
  font-size: 0.9rem;
}

.add-post { margin-bottom: 2rem; }
.add-post h2 { margin-bottom: 1rem; }

.save-section {
  background: rgba(255,255,255,0.95);
  border: 1px solid var(--accent3);
  padding: 1.5rem;
  border-radius: 8px;
  margin-top: 2rem;
  text-align: center;
}
.save-section p { margin-bottom: 1rem; color: var(--smudge); }

.status {
  margin-top: 1rem;
  padding: 0.75rem;
  border-radius: 4px;
  font-weight: 500;
}
.status.success { background: var(--accent3); color: white; }
.status.error { background: var(--red); color: white; }
.status.info { background: var(--accent2); color: white; }

.edit-mode .content,
.edit-mode input,
.edit-mode textarea { background: var(--paper); }

@media (max-width: 600px) {
  body { padding: 1rem; }
  .post { padding: 1rem; }
}
</style>
</head>
<body>
<h1>Blog Admin Panel</h1>

<div id="auth-screen" class="auth-panel">
  <p>Enter your admin password to access the blog editor.</p>
  <div class="form-group">
    <label for="admin-password">Password:</label>
    <input type="password" id="admin-password" placeholder="Enter password">
  </div>
  <button onclick="authenticate()">Login</button>
</div>

<div id="editor" style="display:none;">
  <div class="add-post">
    <h2>Add New Post</h2>
    <div class="form-group">
      <label for="new-title">Title:</label>
      <input type="text" id="new-title" placeholder="Post title">
    </div>
    <div class="form-group">
      <label for="new-content">Content:</label>
      <textarea id="new-content" rows="8" placeholder="Write your post content here..."></textarea>
    </div>
    <button onclick="addPost()">Add Post</button>
  </div>

  <div class="posts">
    <h2>Manage Posts</h2>
    <div id="posts-list"></div>
  </div>

  <div class="save-section">
    <h2>Save All Changes</h2>
    <p>Click below to save all posts to Cloudflare KV instantly. No GitHub commits needed.</p>
    <button id="save-btn" onclick="savePosts()">Save to Cloudflare KV</button>
    <div id="save-status" class="status" style="display:none;"></div>
  </div>
</div>

<script>
let authToken = localStorage.getItem('adminToken') || '';
let posts = [];
let editingId = null;

function showEditor() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('editor').style.display = 'block';
  loadPosts();
}

async function authenticate() {
  const password = document.getElementById('admin-password').value.trim();
  if (!password) {
    alert('Please enter your password.');
    return;
  }

  document.querySelector('#auth-screen button').disabled = true;
  document.querySelector('#auth-screen button').textContent = 'Logging in...';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || 'Login failed');
    }

    authToken = data.token;
    localStorage.setItem('adminToken', authToken);
    showEditor();
  } catch (error) {
    alert('Login failed: ' + error.message);
    document.querySelector('#auth-screen button').disabled = false;
    document.querySelector('#auth-screen button').textContent = 'Login';
  }
}

function logout() {
  authToken = '';
  localStorage.removeItem('adminToken');
  document.getElementById('editor').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'block';
  posts = [];
  editingId = null;
}

async function loadPosts() {
  try {
    const response = await fetch('/api/posts');
    if (!response.ok) throw new Error('Failed to load posts');
    posts = await response.json();
    renderPosts();
  } catch (error) {
    console.error('Failed to load posts:', error);
    showStatus('Failed to load posts. Check console for details.', 'error');
  }
}

function renderPosts() {
  const list = document.getElementById('posts-list');
  list.innerHTML = posts.length === 0 ?
    '<p style="text-align:center; color:var(--smudge); padding:2rem;">No posts yet. Add your first post above!</p>' :
    posts.map((post, index) => `
      <div class="post ${editingId === post.id ? 'edit-mode' : ''}" data-id="${post.id}">
        ${editingId === post.id ? `
          <div class="form-group">
            <label>Title:</label>
            <input type="text" value="${escapeHtml(post.title)}" onchange="updatePostField(${post.id}, 'title', this.value)">
          </div>
          <div class="form-group">
            <label>Content:</label>
            <textarea rows="6" onchange="updatePostField(${post.id}, 'content', this.value)">${escapeHtml(post.content)}</textarea>
          </div>
          <div class="post-actions">
            <button onclick="saveEdit(${post.id})">Save Edit</button>
            <button onclick="cancelEdit()">Cancel</button>
          </div>
        ` : `
          <h3>${escapeHtml(post.title)}</h3>
          <div class="date">${new Date(post.date).toLocaleDateString()}</div>
          <div class="content">${escapeHtml(post.content).replace(/\n/g, '<br>')}</div>
          <div class="post-actions">
            <button onclick="startEdit(${post.id})">Edit</button>
            <button onclick="deletePost(${index})" style="background:var(--red);">Delete</button>
          </div>
        `}
      </div>
    `).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function addPost() {
  const title = document.getElementById('new-title').value.trim();
  const content = document.getElementById('new-content').value.trim();
  if (!title || !content) {
    alert('Please fill in both title and content.');
    return;
  }

  posts.unshift({
    id: Date.now(),
    title,
    content,
    date: new Date().toISOString()
  });

  document.getElementById('new-title').value = '';
  document.getElementById('new-content').value = '';
  renderPosts();
}

function startEdit(id) {
  editingId = id;
  renderPosts();
}

function cancelEdit() {
  editingId = null;
  renderPosts();
}

function updatePostField(id, field, value) {
  const post = posts.find(p => p.id === id);
  if (post) post[field] = value;
}

function saveEdit(id) {
  editingId = null;
  renderPosts();
}

function deletePost(index) {
  if (!confirm('Are you sure you want to delete this post?')) return;
  posts.splice(index, 1);
  renderPosts();
}

async function savePosts() {
  if (!authToken) {
    alert('Please log in first.');
    return;
  }

  const btn = document.getElementById('save-btn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving...';

  showStatus('Saving posts to Cloudflare KV...', 'info');

  try {
    const response = await fetch('/api/posts', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${authToken}`
      },
      body: JSON.stringify({ posts })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || 'Save failed');
    }

    showStatus('Posts saved successfully to Cloudflare KV!', 'success');
  } catch (error) {
    console.error('Save error:', error);
    showStatus('Save failed: ' + error.message, 'error');
    if (error.message.includes('Unauthorized')) logout();
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function showStatus(message, type) {
  const status = document.getElementById('save-status');
  status.textContent = message;
  status.className = `status ${type}`;
  status.style.display = 'block';
  setTimeout(() => status.style.display = 'none', 5000);
}

if (authToken) {
  showEditor();
}
</script>
</body>
</html>
