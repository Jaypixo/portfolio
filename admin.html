<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin — Jaypix</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/logo-black.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<div class="torn-top"></div>

<nav>
  <div class="container">
    <a href="index.html" class="nav-brand"><img src="assets/logo.png" alt=""> Jaypix</a>
    <div class="nav-links">
      <a href="blog.html">← Back to blog</a>
      <button class="theme-toggle" aria-label="Toggle theme"></button>
    </div>
  </div>
</nav>

<div class="admin-shell">

  <div id="auth-gate" class="auth-gate">
    <h1 style="font-family: var(--serif); font-weight: 400; font-size: 1.8rem; margin-bottom: 8px;">Admin</h1>
    <p>Enter the admin password to manage posts.</p>
    <div class="field">
      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" autocomplete="current-password">
    </div>
    <button type="button" class="btn btn-primary" id="login-btn">Log in</button>
    <div class="auth-error" id="auth-error"></div>
  </div>

  <div id="admin-app" style="display:none;">
    <div class="admin-topbar">
      <h1>Manage posts</h1>
      <div class="admin-topbar-actions">
        <button type="button" class="btn btn-ghost" id="new-post-btn">+ New post</button>
        <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
      </div>
    </div>

    <div id="admin-banner" class="admin-banner"></div>

    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="sidebar-tools">
          <input type="search" id="sidebar-search" placeholder="Search posts…">
          <div class="filter-row">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="published">Published</button>
            <button type="button" class="filter-btn" data-filter="draft">Drafts</button>
          </div>
        </div>
        <ul class="post-list" id="post-list"></ul>
      </aside>

      <main class="admin-editor" id="admin-editor">
        <div class="editor-empty" id="editor-empty">Select a post from the list, or create a new one.</div>

        <div id="editor-form" style="display:none;">
          <div class="editor-toolbar">
            <div class="toolbar-left">
              <span class="status-pill" id="editor-status-pill">Draft</span>
              <span class="unsaved-dot" id="unsaved-dot" title="Unsaved changes"></span>
            </div>
            <div class="toolbar-right">
              <a href="#" target="_blank" id="view-live-link" class="btn btn-ghost" style="display:none;">View live →</a>
              <button type="button" class="btn btn-ghost" id="copy-link-btn" style="display:none;">Copy link</button>
              <button type="button" class="btn btn-ghost" id="delete-post-btn" style="display:none;">Delete</button>
              <button type="button" class="btn btn-primary" id="save-post-btn">Save</button>
            </div>
          </div>

          <div class="field">
            <label for="field-title">Title</label>
            <input type="text" id="field-title" placeholder="Post title">
          </div>

          <div class="field">
            <label for="field-slug">Slug</label>
            <div class="field-row">
              <input type="text" id="field-slug" placeholder="post-slug">
              <button type="button" id="regen-slug-btn">Regenerate</button>
            </div>
            <div class="field-hint" id="slug-hint">jaypix.dev/post.html?slug=…</div>
          </div>

          <div class="field">
            <label for="field-excerpt">Excerpt</label>
            <div class="field-row">
              <textarea id="field-excerpt" rows="2" maxlength="400" placeholder="Short summary shown on the blog listing"></textarea>
              <button type="button" id="fill-excerpt-btn">Fill from body</button>
            </div>
            <div class="field-hint"><span id="excerpt-count">0</span>/400</div>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="field-tags">Tags</label>
              <div class="chip-input-wrap" id="tags-wrap">
                <input type="text" id="field-tags" placeholder="Add a tag, press Enter">
              </div>
            </div>
            <div class="field">
              <label for="field-cover">Cover image URL</label>
              <input type="url" id="field-cover" placeholder="https://…">
              <img id="cover-preview" class="cover-preview" alt="">
            </div>
          </div>

          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="field-published">
              <span class="toggle-switch"></span>
              Published
            </label>
            <label class="toggle">
              <input type="checkbox" id="field-featured">
              <span class="toggle-switch"></span>
              Featured
            </label>
          </div>

          <div class="field">
            <label for="field-body">Body (Markdown)</label>
          </div>
          <div class="editor-split">
            <div class="field" style="margin-bottom:0;">
              <textarea id="field-body" placeholder="Write in Markdown…"></textarea>
            </div>
            <div class="preview-pane">
              <div class="preview-pane-label">Live preview</div>
              <div id="body-preview" class="post-body"></div>
            </div>
          </div>
          <div class="editor-stats">
            <span id="word-count">0 words</span>
            <span id="read-time">0 min read</span>
          </div>
        </div>
      </main>
    </div>
  </div>

</div>

<script src="https://remarkerwebsite.pages.dev/remarker.js"></script>
<script src="js/site.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
